version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qagent-postgres
    environment:
      POSTGRES_USER: qagent
      POSTGRES_PASSWORD: ®
      POSTGRES_DB: qagent
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qagent -d qagent']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
